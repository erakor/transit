<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>transit API</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Scalar renders openapi.json (generated by `pnpm build:openapi`). Pinned, with the file's hash: it runs on
         the API's origin, where visitors type their token. To bump it, hash the new package's file (sha384). -->
    <script
      src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.2/dist/browser/standalone.js"
      integrity="sha384-mCh2A/B6vkfhiHyzwBZm7lbFmEK5fE/96Kbtk+RH1zei1P/XEt0I2MCiG6WfZdor"
      crossorigin="anonymous"
    ></script>
    <script>
      // Nothing from Scalar's servers: no AI agent (it would send them the API description), system fonts.
      Scalar.createApiReference('#app', { url: '/openapi.json', agent: { disabled: true }, withDefaultFonts: false })
    </script>
  </body>
</html>
