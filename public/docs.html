<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>transit API</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Scalar renders openapi.json (generated by `pnpm build:openapi`). Pinned: bump the version on purpose. -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.2/dist/browser/standalone.js"></script>
    <script>
      // No AI agent: it would send the API description to Scalar's service.
      Scalar.createApiReference('#app', { url: '/openapi.json', agent: { disabled: true } })
    </script>
  </body>
</html>
