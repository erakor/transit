name: Refresh static GTFS

# Regenerates src/data/*.generated.ts from the static GTFS of the subway, LIRR, Metro-North and
# NYC Ferry, and commits them when one changed. The push to main makes Vercel deploy the new data (and purge the CDN cache).
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # engines.node
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:static
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        run: pnpm typecheck && pnpm test
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh static GTFS"
          git push
