name: Live smoke test

# Checks the live MTA feeds still decode and match the static data, so upstream format
# changes show up. If the TRANSIT_BASE_URL and TRANSIT_TOKEN repository secrets are set,
# it also calls the deployment: 401 without the token, 200 with it, CDN hit on a repeat.
on:
  schedule:
    - cron: "17 13 * * *" # morning rush in New York
    - cron: "47 22 * * *" # evening
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke
        env:
          TRANSIT_BASE_URL: ${{ secrets.TRANSIT_BASE_URL }}
          TRANSIT_TOKEN: ${{ secrets.TRANSIT_TOKEN }}
