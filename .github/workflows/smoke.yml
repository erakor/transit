name: Live smoke test

# Checks the live feeds (MTA subway, LIRR, Metro-North, alerts, PATH, NYC Ferry, Citi Bike, and
# Bus Time when the BUSTIME_KEY secret is set) still decode and match the static data, so upstream
# format changes show up. If the TRANSIT_BASE_URL and TRANSIT_TOKEN repository secrets are set,
# it also calls the deployment: 401 without the token, 200 with it, CDN hit on a repeat.
on:
  schedule:
    - cron: '17 13 * * *' # morning rush in New York
    - cron: '47 22 * * *' # evening
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # engines.node
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke
        env:
          TRANSIT_BASE_URL: ${{ secrets.TRANSIT_BASE_URL }}
          TRANSIT_TOKEN: ${{ secrets.TRANSIT_TOKEN }}
          BUSTIME_KEY: ${{ secrets.BUSTIME_KEY }}
